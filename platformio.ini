[env:m5stickc-plus]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -I src
build_src_filter = +<*> +<buddies/> -<geekmagic/>
lib_deps =
    m5stack/M5StickCPlus
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

; --- GeekMagic SmallTV Pro (ESP32-WROOM-32, ST7789 240x240) ----------------
; Uses TFT_eSPI directly plus the M5 compat shim in src/geekmagic/.
; Flash: hold the touch pad / bridge GPIO0 to GND while powering on to enter
; the bootloader, then `pio run -e geekmagic-smalltv-pro -t upload`.
[env:geekmagic-smalltv-pro]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
build_src_filter = +<*> +<buddies/> +<geekmagic/>
build_flags =
    -DTARGET_GEEKMAGIC=1
    -DCORE_DEBUG_LEVEL=0
    -I src
    ; ---- single capacitive touch pad (CONFIRM/ADJUST for your unit) ----
    -DBUDDY_TOUCH_PIN=32
    -DBUDDY_TOUCH_THRESHOLD=40
    ; if your pad is wired as a plain active-low button instead, add:
    ; -DBUDDY_TOUCH_DIGITAL=1
    ; ---- backlight (GPIO5, active-low PWM) ----
    -DBUDDY_BL_PIN=5
    ; ---- TFT_eSPI panel config: ST7789 240x240 ----
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_DC=0
    -DTFT_RST=2
    -DTFT_CS=-1
    -DTFT_MISO=-1
    -DTFT_BL=-1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
